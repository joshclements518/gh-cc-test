<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote for Friday Snack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .poll-info {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .error {
      background: #ffe0e0;
      color: #cc0000;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .options-list {
      margin-bottom: 30px;
    }
    
    .option-item {
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .option-item:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
    }
    
    .option-item.selected {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }
    
    .option-radio {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #667eea;
      flex-shrink: 0;
      position: relative;
    }
    
    .option-item.selected .option-radio {
      border-color: white;
      background: white;
    }
    
    .option-item.selected .option-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #667eea;
    }
    
    .option-text {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-1px);
    }
    
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .success-container {
      display: none;
      text-align: center;
    }
    
    .success-container.active {
      display: block;
    }
    
    .success-icon {
      color: #51cf66;
      font-size: 72px;
      margin-bottom: 20px;
    }
    
    .success-message {
      color: #333;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .success-subtitle {
      color: #666;
      font-size: 16px;
    }
    
    .poll-closed {
      background: #fff3cd;
      color: #856404;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">
      Loading poll...
    </div>
    
    <div id="pollContainer" style="display: none;">
      <h1 id="pollTitle"></h1>
      <div class="poll-info">
        <span id="pollClosesAt"></span>
      </div>
      
      <div id="errorMessage" class="error" style="display: none;"></div>
      <div id="pollClosed" class="poll-closed" style="display: none;">
        This poll has closed.
      </div>
      
      <div id="voteForm">
        <div class="options-list" id="optionsList"></div>
        <button id="submitBtn" class="btn btn-primary" disabled>Submit Vote</button>
      </div>
      
      <div id="successContainer" class="success-container">
        <div class="success-icon">&#10003;</div>
        <div class="success-message">Vote Submitted!</div>
        <div class="success-subtitle">Thanks for voting. Results will be revealed when the poll closes.</div>
      </div>
    </div>
  </div>
  
  <script>
    let selectedOptionId = null;
    let pollData = null;
    
    async function loadPoll() {
      const shareToken = window.location.pathname.split('/').pop();
      
      try {
        const response = await fetch(`/api/polls/${shareToken}`);
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to load poll');
        }
        
        pollData = data;
        displayPoll(data);
      } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('pollContainer').style.display = 'block';
        document.getElementById('errorMessage').textContent = error.message;
        document.getElementById('errorMessage').style.display = 'block';
      }
    }
    
    function displayPoll(poll) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('pollContainer').style.display = 'block';
      document.getElementById('pollTitle').textContent = poll.title;
      
      const closesAt = new Date(poll.closesAt);
      const now = new Date();
      const isClosed = closesAt < now;
      
      document.getElementById('pollClosesAt').textContent = 
        isClosed ? 'Poll closed' : `Closes ${closesAt.toLocaleString()}`;
      
      if (isClosed) {
        document.getElementById('pollClosed').style.display = 'block';
        document.getElementById('voteForm').style.display = 'none';
        return;
      }
      
      const optionsList = document.getElementById('optionsList');
      poll.options.forEach(option => {
        const div = document.createElement('div');
        div.className = 'option-item';
        div.innerHTML = `
          <div class="option-radio"></div>
          <div class="option-text">${escapeHtml(option.text)}</div>
        `;
        div.onclick = () => selectOption(option.id, div);
        optionsList.appendChild(div);
      });
    }
    
    function selectOption(optionId, element) {
      // Remove previous selection
      document.querySelectorAll('.option-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      // Add selection to clicked option
      element.classList.add('selected');
      selectedOptionId = optionId;
      document.getElementById('submitBtn').disabled = false;
    }
    
    async function submitVote() {
      if (!selectedOptionId) return;
      
      const shareToken = window.location.pathname.split('/').pop();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      
      try {
        const response = await fetch(`/api/polls/${shareToken}/vote`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ optionId: selectedOptionId })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to submit vote');
        }
        
        document.getElementById('voteForm').style.display = 'none';
        document.getElementById('successContainer').classList.add('active');
      } catch (error) {
        document.getElementById('errorMessage').textContent = error.message;
        document.getElementById('errorMessage').style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Vote';
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    document.getElementById('submitBtn').addEventListener('click', submitVote);
    
    window.addEventListener('DOMContentLoaded', loadPoll);
  </script>
</body>
</html>
