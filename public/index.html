<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Snack Vote - Create Poll</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>🍿 Friday Snack Vote</h1>
        <p class="subtitle">Create your weekly snack poll</p>

        <form id="pollForm">
            <div class="form-group">
                <label for="title">Poll Title</label>
                <input type="text" id="title" name="title" required placeholder="What's Friday's snack?">
            </div>

            <div class="form-group">
                <label>Snack Options (min. 2)</label>
                <div id="optionsContainer">
                    <input type="text" class="option-input" placeholder="Option 1" required>
                    <input type="text" class="option-input" placeholder="Option 2" required>
                </div>
                <button type="button" id="addOption" class="btn-secondary">+ Add Option</button>
            </div>

            <div class="form-group">
                <label for="closesAt">Closes At (optional)</label>
                <input type="datetime-local" id="closesAt" name="closesAt">
            </div>

            <button type="submit" class="btn-primary">Create Poll</button>
        </form>

        <div id="result" class="result hidden">
            <h2>Poll Created! 🎉</h2>
            <p>Share this link with your team:</p>
            <div class="share-link">
                <input type="text" id="shareUrl" readonly>
                <button onclick="copyLink()" class="btn-secondary">Copy</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('pollForm');
        const optionsContainer = document.getElementById('optionsContainer');
        const addOptionBtn = document.getElementById('addOption');
        const resultDiv = document.getElementById('result');
        const shareUrlInput = document.getElementById('shareUrl');

        // Add more options
        addOptionBtn.addEventListener('click', () => {
            const optionCount = optionsContainer.children.length + 1;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'option-input';
            input.placeholder = `Option ${optionCount}`;
            optionsContainer.appendChild(input);
        });

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const closesAt = document.getElementById('closesAt').value;
            const optionInputs = document.querySelectorAll('.option-input');
            const options = Array.from(optionInputs)
                .map(input => input.value.trim())
                .filter(val => val !== '');

            if (options.length < 2) {
                alert('Please provide at least 2 options');
                return;
            }

            try {
                const response = await fetch('/api/poll', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        options,
                        closesAt: closesAt || null
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    shareUrlInput.value = data.shareUrl;
                    form.style.display = 'none';
                    resultDiv.classList.remove('hidden');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Failed to create poll: ' + error.message);
            }
        });

        function copyLink() {
            shareUrlInput.select();
            document.execCommand('copy');
            alert('Link copied to clipboard!');
        }
    </script>
</body>
</html>
