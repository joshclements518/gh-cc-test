<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday Snack Vote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 24px;
      font-size: 32px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #667eea;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 8px;
    }

    button:hover {
      background: #5568d3;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: #e0e0e0;
      color: #333;
    }

    button.secondary:hover {
      background: #d0d0d0;
    }

    .option-input {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .option-input input {
      flex: 1;
      margin-bottom: 0;
    }

    .option-input button {
      width: auto;
      padding: 12px 16px;
      background: #ff4757;
      margin-top: 0;
    }

    .option-input button:hover {
      background: #e8394a;
    }

    .vote-option {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s;
    }

    .vote-option:hover {
      border-color: #667eea;
      background: #f0f0ff;
    }

    .vote-option.selected {
      border-color: #667eea;
      background: #e8ecff;
    }

    .vote-option input[type="radio"] {
      margin-right: 12px;
    }

    .result-bar {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .result-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      opacity: 0.15;
      transition: width 0.5s ease;
    }

    .result-bar-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-text {
      font-weight: 600;
    }

    .result-votes {
      font-size: 14px;
      color: #666;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
    }

    .link-display {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      word-break: break-all;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Friday Snack Vote</h1>

    <!-- Create Poll Form -->
    <div id="createPollSection" class="card">
      <h2>Create New Poll</h2>
      <form id="createPollForm">
        <label for="pollTitle">Poll Title</label>
        <input type="text" id="pollTitle" placeholder="What's your favorite snack?" required>

        <label>Options</label>
        <div id="optionsContainer">
          <div class="option-input">
            <input type="text" class="option" placeholder="Option 1" required>
          </div>
          <div class="option-input">
            <input type="text" class="option" placeholder="Option 2" required>
          </div>
        </div>

        <button type="button" id="addOptionBtn" class="secondary">+ Add Option</button>
        <button type="submit">Create Poll</button>
      </form>
    </div>

    <!-- Vote Section -->
    <div id="voteSection" class="card hidden">
      <h2 id="votePollTitle"></h2>
      <form id="voteForm">
        <div id="voteOptions"></div>
        <button type="submit">Cast Vote</button>
      </form>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="card hidden">
      <h2 id="resultsPollTitle"></h2>
      <div id="resultsContainer"></div>
      <button id="backBtn" class="secondary">Create Another Poll</button>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let currentPollId = null;

    // Check URL for poll ID
    const urlParams = new URLSearchParams(window.location.search);
    const pollIdFromUrl = urlParams.get('poll');
    
    if (pollIdFromUrl) {
      loadPoll(pollIdFromUrl);
    }

    // Add option input
    document.getElementById('addOptionBtn').addEventListener('click', () => {
      const container = document.getElementById('optionsContainer');
      const optionCount = container.querySelectorAll('.option-input').length + 1;
      const div = document.createElement('div');
      div.className = 'option-input';
      div.innerHTML = `
        <input type="text" class="option" placeholder="Option ${optionCount}" required>
        <button type="button" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    });

    // Create poll
    document.getElementById('createPollForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('pollTitle').value;
      const options = Array.from(document.querySelectorAll('.option'))
        .map(input => input.value.trim())
        .filter(val => val);

      if (options.length < 2) {
        alert('Please add at least 2 options');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/polls`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, options })
        });

        const data = await response.json();
        
        if (response.ok) {
          currentPollId = data.id;
          showVoteSection(data.id, title, options);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (error) {
        alert('Failed to create poll: ' + error.message);
      }
    });

    // Show vote section
    function showVoteSection(pollId, title, options) {
      document.getElementById('createPollSection').classList.add('hidden');
      document.getElementById('resultsSection').classList.add('hidden');
      
      const voteSection = document.getElementById('voteSection');
      document.getElementById('votePollTitle').textContent = title;
      
      const voteOptions = document.getElementById('voteOptions');
      voteOptions.innerHTML = options.map((opt, idx) => `
        <div class="vote-option" onclick="this.querySelector('input').checked = true; document.querySelectorAll('.vote-option').forEach(el => el.classList.remove('selected')); this.classList.add('selected');">
          <label style="cursor: pointer; display: flex; align-items: center;">
            <input type="radio" name="option" value="${idx}" required>
            <span>${opt}</span>
          </label>
        </div>
      `).join('');
      
      voteSection.classList.remove('hidden');
      
      // Update URL
      const shareUrl = `${window.location.origin}${window.location.pathname}?poll=${pollId}`;
      const linkDiv = document.createElement('div');
      linkDiv.className = 'link-display';
      linkDiv.innerHTML = `<strong>Share link:</strong><br>${shareUrl}`;
      voteSection.appendChild(linkDiv);
    }

    // Cast vote
    document.getElementById('voteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const selectedOption = document.querySelector('input[name="option"]:checked');
      if (!selectedOption) {
        alert('Please select an option');
        return;
      }

      const pollId = currentPollId;
      
      try {
        // Get poll data to find option IDs
        const pollResponse = await fetch(`${API_BASE}/polls/${pollId}`);
        const pollData = await pollResponse.json();
        
        const optionIndex = parseInt(selectedOption.value);
        const optionId = pollData.options[optionIndex].id;

        const response = await fetch(`${API_BASE}/polls/${pollId}/votes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ option_id: optionId })
        });

        const data = await response.json();
        
        if (response.ok) {
          loadPoll(pollId);
        } else {
          alert('Error: ' + data.error);
        }
      } catch (error) {
        alert('Failed to cast vote: ' + error.message);
      }
    });

    // Load poll and show results
    async function loadPoll(pollId) {
      try {
        const response = await fetch(`${API_BASE}/polls/${pollId}`);
        const data = await response.json();
        
        if (response.ok) {
          currentPollId = pollId;
          showResults(data);
        } else {
          alert('Poll not found');
        }
      } catch (error) {
        alert('Failed to load poll: ' + error.message);
      }
    }

    // Show results
    function showResults(pollData) {
      document.getElementById('createPollSection').classList.add('hidden');
      document.getElementById('voteSection').classList.add('hidden');
      
      const resultsSection = document.getElementById('resultsSection');
      document.getElementById('resultsPollTitle').textContent = pollData.title;
      
      const resultsContainer = document.getElementById('resultsContainer');
      resultsContainer.innerHTML = pollData.options.map(opt => `
        <div class="result-bar">
          <div class="result-bar-fill" style="width: ${opt.percentage}%"></div>
          <div class="result-bar-content">
            <span class="result-text">${opt.text}</span>
            <span class="result-votes">${opt.percentage}% (${opt.votes} ${opt.votes === 1 ? 'vote' : 'votes'})</span>
          </div>
        </div>
      `).join('');
      
      resultsContainer.innerHTML += `<p style="text-align: center; margin-top: 16px; color: #666;">Total votes: ${pollData.total_votes}</p>`;
      
      resultsSection.classList.remove('hidden');
    }

    // Back to create poll
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = window.location.pathname;
    });
  </script>
</body>
</html>
